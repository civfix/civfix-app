packages:
  - "apps/*"
  - "packages/*"

# Metro, the Expo config plugins and CocoaPods are proven on a flat node_modules.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false
preferWorkspacePackages: true
linkWorkspacePackages: true

# A dependency that declares it cannot run on our Node must stop the install, not print a warning CI ignores.
engineStrict: true

# Supply-chain gates (civfix/issue-tracker#259 D11). A version must be a day old before it can resolve, so a
# hijacked publish is usually caught and pulled first. @civfix/* is exempt: it is our own registry, and a fresh
# contract or tokens publish has to be adoptable the same day. An urgent same-day security fix gets its own
# per-package entry in minimumReleaseAgeExclude; never lower the global age.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@civfix/*"
# Refuse a version published with weaker provenance than the versions before it (a stolen token, not CI).
trustPolicy: no-downgrade
# Exact versions that fail that check only because a newer line had started publishing with provenance before these
# maintenance releases of an older line were published by hand, each checked to come from the package's usual
# maintainer: eslint-import-resolver-typescript 3.10.1 (jounqin; after 4.2.6, for eslint-config-expo), semver 6.3.1
# (lukekarrys; after 7.5.1), ua-parser-js 1.0.41 (faisalman; after 2.0.0), undici-types 6.21.0 (matteo.collina, for
# @types/node 22; 6.13.0 to 6.19.2 attested), and every expo, expo-*, @expo/*, babel-preset-expo, eslint-config-expo and
# unimodules-app-loader entry (the Expo SDK 57 set, alanhughes, who publishes Expo's SDK 57 releases by hand; Expo has
# published its canaries since August 2026 and its SDK 58 line through trusted publishing). jscpd 4.3.0 (apk, its only
# maintainer) is the last release of the 4 line, held because jscpd 5 reports this tree over the duplication threshold.
# Drop each entry once the tree leaves that version. Never exclude a package name without a version.
trustPolicyExclude:
  - "@expo/cli@57.0.32"
  - "@expo/config-plugins@57.0.11"
  - "@expo/config@57.0.10"
  - "@expo/env@2.4.3"
  - "@expo/fingerprint@0.20.14"
  - "@expo/image-utils@0.11.6"
  - "@expo/inline-modules@0.1.8"
  - "@expo/local-build-cache-provider@57.0.9"
  - "@expo/log-box@57.0.4"
  - "@expo/metro-config@57.0.13"
  - "@expo/metro-file-map@57.0.4"
  - "@expo/metro-runtime@57.0.17"
  - "@expo/prebuild-config@57.0.19"
  - "@expo/require-utils@57.0.6"
  - "@expo/router-server@57.0.14"
  - "@expo/ui@57.0.26"
  - babel-preset-expo@57.0.16
  - eslint-config-expo@57.0.2
  - eslint-import-resolver-typescript@3.10.1
  - expo-apple-authentication@57.0.2
  - expo-application@57.0.3
  - expo-asset@57.0.20
  - expo-blur@57.0.3
  - expo-build-properties@57.0.22
  - expo-clipboard@57.0.2
  - expo-constants@57.0.22
  - expo-crypto@57.0.4
  - expo-dev-client@57.0.20
  - expo-dev-launcher@57.0.21
  - expo-dev-menu@57.0.20
  - expo-file-system@57.0.7
  - expo-font@57.0.4
  - expo-glass-effect@57.0.4
  - expo-haptics@57.0.3
  - expo-image-manipulator@57.0.21
  - expo-image-picker@57.0.20
  - expo-json-utils@57.0.2
  - expo-keep-awake@57.0.2
  - expo-linking@57.0.13
  - expo-localization@57.0.2
  - expo-location@57.0.22
  - expo-manifests@57.0.2
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.24
  - expo-modules-jsi@57.1.3
  - expo-navigation-bar@57.0.3
  - expo-notifications@57.0.24
  - expo-router@57.0.29
  - expo-secure-store@57.0.4
  - expo-server@57.0.3
  - expo-splash-screen@57.0.10
  - expo-symbols@57.0.3
  - expo-system-ui@57.0.4
  - expo-task-manager@57.0.21
  - expo-updates-interface@57.0.2
  - expo-web-browser@57.0.3
  - expo@57.0.31
  - jscpd@4.3.0
  - semver@6.3.1
  - ua-parser-js@1.0.41
  - undici-types@6.21.0
  - unimodules-app-loader@57.0.2
# A git or tarball-URL subdependency carries no publish time or provenance, so it would slip past both checks above.
blockExoticSubdeps: true
# A new install script must stop the install for review: skipped silently, it can also break a native binary unnoticed.
strictDepBuilds: true

# The only dependencies whose install scripts run. esbuild, unrs-resolver and workerd each check or fetch their
# native binary; every other dependency installs without running code. The workspace's own postinstall
# (community-mobile builds packages/tokens) is not a dependency script and still runs. Add a package here only after
# reading its script.
allowBuilds:
  "@shopify/react-native-skia": true
  esbuild: true
  unrs-resolver: true
  workerd: true

# The react, react-dom and react-native entries pin the Expo SDK set. Each range entry forces a patched release of a
# transitive package whose parent still declares a vulnerable range, held inside the major its parent asks for with one
# exception: uuid goes to 11 under xcode, which asks for ^7 in the iOS prebuild path and only calls v4(). undici is
# scoped per major because @expo/cli wants 6, miniflare pins 7 exactly and jsdom wants 8. node-forge floors at 1.4.2,
# not 1.4.1, because 1.4.1's PEM fix broke Buffer input to pem.decode(). Drop each entry once its parent ships the fixed
# range itself.
overrides:
  react: "19.2.3"
  react-dom: "19.2.3"
  react-native: "0.86.3"
  vite: ">=8.3.3 <9"
  js-yaml@3: ">=3.15.1 <4"
  js-yaml@4: ">=4.3.1 <5"
  brace-expansion@1: ">=1.1.21 <2"
  brace-expansion@2: ">=2.1.7 <3"
  brace-expansion@5: ">=5.0.12 <6"
  shell-quote: ">=1.11.0 <2"
  nanoid@3: ">=3.3.18 <4"
  postcss: ">=8.5.28 <9"
  browserslist: ">=4.28.9 <5"
  uuid: ">=11.1.1 <12"
  "@xmldom/xmldom@0.8": ">=0.8.15 <0.9"
  "@xmldom/xmldom@0.9": ">=0.9.12 <0.10"
  fast-uri: ">=3.1.9 <4"
  tar: ">=7.5.21 <8"
  undici@6: ">=6.29.1 <7"
  undici@7: ">=7.30.1 <8"
  compression: ">=1.8.2 <2"
  source-map-js@1: ">=1.2.2 <2"
  sharp: ">=0.35.5 <0.36"
  zod@4: ">=4.6.6 <5"
  node-forge: ">=1.4.2 <2"

# No untrusted input reaches any ignored advisory; each entry says when it can go.
auditConfig:
  ignoreGhsas:
    # minimatch pattern-amplification DoS and glob's AbortSignal cancellation bypass, fixed only in the new majors
    # (minimatch 11.0.1, glob 14.0.2) that no parent accepts yet. They arrive only through build and dev tooling
    # (the Expo CLI, config, fingerprint and metro-config packages, React Native's codegen and CLI scripts, eslint
    # and its plugins, jest coverage), none of which ships in the app bundle or the static export, and every pattern
    # comes from this repo or those tools. The one signal-bounded walk is the Expo CLI's TypeScript prerequisite
    # check, a 5-second-capped scan of the developer's own checkout. Remove once the lockfile holds no glob
    # 9.0.0-14.0.1 and no minimatch below 11.0.1.
    - GHSA-g3hv-75wg-m249
    - GHSA-3g3m-2fjr-6pw4
    # zod's memory exhaustion on oversized constrained collections, fixed only in 4.6.6 with no fixed 3.x line. It
    # arrives only through @expo/cli 57's zod ^3.25.76, which the Expo dev server alone loads, to validate installed
    # devtools plugins' manifests and MCP extension output (DevToolsPlugin.schema.js,
    # createMCPDevToolsExtensionSchema.js); none of it ships in the app bundle or the static export. Remove once the
    # lockfile holds no zod below 4.6.6.
    - GHSA-mrhx-c7xc-m3w5
    # decode-uri-component's only fixed line (0.5.x) is ESM-only while query-string 7 (which expo-router 56 depends on
    # for the react-navigation core it vendors) require()s it as a function; expo-router always supplies its own
    # getStateFromPath and only calls query-string stringify, never its decoder. Remove once expo-router no longer
    # depends on query-string 7.
    - GHSA-vcc3-ghjq-m6fr
    - GHSA-qr28-fpjm-wq7f
