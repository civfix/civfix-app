name: publish @civfix/shared snapshot

# Publishes the branch's @civfix/shared as a prerelease so a civfix-backend / civfix-admin branch can
# install an unmerged contract. Run it by hand on any branch except main:
#
#   gh workflow run publish-shared-snapshot.yml --ref <branch>
#
# The version is <package.json version>-b-<branch slug>.g<short sha>, e.g. 0.53.0-b-feat-feed.g1a2b3c4,
# under the `snapshot` dist-tag. A caret range never matches a prerelease, so a consumer only gets it by
# pinning that exact version, and it never takes a real version number from main. Nothing is committed
# and no tag is pushed. The package is built before the registry token is written and published with
# --ignore-scripts, so no lifecycle script from the branch runs while the token is present. Once the
# civfix-app PR merges and main publishes the real version, the consumer branch moves its pin to the
# normal caret range.
#
# Required repository secret: NPM_TOKEN (the Verdaccio ci-publisher token).

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-shared-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stamp snapshot version
        id: stamp
        working-directory: packages/shared
        run: |
          base=$(node -p "require('./package.json').version")
          slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | cut -c1-40 | sed -E 's/^-+//; s/-+$//')
          : "${slug:?branch name has no usable characters}"
          version="${base}-b-${slug}.g${GITHUB_SHA::7}"
          npm pkg set version="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm --filter @civfix/shared build

      - name: Append registry auth to .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          {
            echo "//repo.civfix.org/:_authToken=${NPM_TOKEN}"
            echo "git-checks=false"
          } >> .npmrc
      - name: Publish
        working-directory: packages/shared
        run: pnpm publish --tag snapshot --no-git-checks --ignore-scripts

      - name: Summary
        env:
          VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          {
            echo "Published \`@civfix/shared@${VERSION}\` (dist-tag \`snapshot\`)."
            echo
            echo "Pin it in a consumer branch with the exact version: \`\"@civfix/shared\": \"${VERSION}\"\`, then \`pnpm install\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore .npmrc
        if: always()
        run: git checkout -- .npmrc
