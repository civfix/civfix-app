name: publish @civfix/tokens

# Publishes @civfix/tokens to the private registry (repo.civfix.org) when its version is ahead of the
# registry, on push to main. Publishing is not a production action, so it belongs on main (the staging
# lane): the registry consumers (civfix-backend, civfix-admin) adopt a new version
# deliberately by moving their own caret range, and a backend release is built from a lockfile that
# already pins an exact version. @civfix/ui and both apps are private and are never published; the API
# contract publishes from civfix/civfix-contract.
#
# Flow: `pnpm changeset` while developing -> `pnpm changeset version` before merging -> this workflow
# runs `changeset publish`, which is a no-op when nothing is ahead of the registry (so it runs on every
# main push and a failed publish is retried by the next one). Each release is findable by its annotated
# @civfix/tokens@X.Y.Z tag, hence the git identity step.
#
# Only main publishes real versions: a manual run on any other branch is skipped. A branch that needs
# its tokens on the registry uses publish-tokens-snapshot.yml, which publishes a prerelease no caret
# range can match. scripts/check-tokens-version.mjs refuses a version the registry already holds from
# a commit main never released, and pushes the @civfix/tokens@X.Y.Z tag BEFORE the publish, so a
# failed publish is retried by the next main push and a failed tag push stops before anything reaches
# the registry.
#
# Required repository secret: NPM_TOKEN (the Verdaccio ci-publisher token).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-tokens
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    # Publishing `latest` is a main-only act; the environment's ref policy enforces that at admission.
    environment: staging
    runs-on: ubuntu-latest
    permissions:
      # check-tokens-version.mjs --release pushes the @civfix/tokens@X.Y.Z tag.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag push in "Tag the release on main" authenticates with these checkout credentials.
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      # No dependency cache: a cache any other run on main wrote could poison what this job publishes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Configure git identity for release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # No dependency install script runs in a job that later holds the registry token. The build needs
      # none: esbuild resolves its platform binary from its optional dependency without its postinstall.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @civfix/tokens build

      - name: Append registry auth to .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          {
            echo "//repo.civfix.org/:_authToken=${NPM_TOKEN}"
            echo "git-checks=false"
          } >> .npmrc
      - name: Tag the release on main
        run: node scripts/check-tokens-version.mjs --release
      - name: Publish
        env:
          # The package was built above, before the token existed; prepublishOnly would rebuild it next
          # to the token. changesets passes this through to `pnpm publish`.
          npm_config_ignore_scripts: "true"
        run: pnpm changeset publish --no-git-tag

      - name: Restore .npmrc
        if: always()
        run: git checkout -- .npmrc
