name: CI

# main is the only long-lived branch; it deploys staging, and production ships from a published v*
# release. Every PR runs it whatever its base: a stacked PR targets its parent slice's branch, and the
# agents rely on this run as the full check of each slice they push.
on:
  pull_request:
  # main's merge queue waits for the required checks on its own gh-readonly-queue/* commit; without this
  # trigger they never report there and every queued PR times out.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: packages (shared + ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm check:licenses
      - run: node --test scripts/*.test.mjs
      - name: Workflow security (zizmor)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          persona: regular
          min-severity: medium
          online-audits: false
          advanced-security: false
      - run: node scripts/check-tokens-version.mjs
      - run: pnpm format:check
      - run: pnpm turbo run build typecheck lint test:coverage --filter="./packages/*"
      - run: pnpm turbo run typecheck:scripts lint:scripts
      - run: pnpm --filter @civfix/ui i18n:check
      # Repo-wide gates (apps included) live here because this job already installs every workspace;
      # the resources check imports @civfix/contract from the registry install.
      - run: pnpm --filter @civfix/ui i18n:check:resources
      - run: pnpm i18n:check:call-sites
      - run: pnpm knip
      - run: pnpm jscpd

  web:
    name: community-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck build test:coverage --filter=community-web

  mobile:
    name: community-mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint test:coverage --filter=community-mobile
      - run: shellcheck apps/community-mobile/scripts/*.sh
      - run: pnpm run doctor:expo
