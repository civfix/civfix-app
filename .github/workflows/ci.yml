name: CI

# main is the only long-lived branch; it deploys staging, and production ships from a published v*
# release. Every PR runs it whatever its base: a stacked PR targets its parent slice's branch, and the
# agents rely on this run as the full check of each slice they push.
on:
  pull_request:
  # main's merge queue waits for the required checks on its own gh-readonly-queue/* commit; without this
  # trigger they never report there and every queued PR times out.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: packages (shared + ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-tokens-version.mjs
      - run: pnpm turbo run build typecheck lint test --filter="./packages/*"
      - run: pnpm --filter @civfix/ui i18n:check
      # Repo-wide gates (apps included) live here because this job already installs every workspace;
      # the resources check imports @civfix/contract from the registry install.
      - run: pnpm --filter @civfix/ui i18n:check:resources
      - run: pnpm i18n:check:call-sites
      - run: pnpm knip
      - run: pnpm jscpd

  web:
    name: community-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck build test --filter=community-web

  mobile:
    name: community-mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint test --filter=community-mobile
      - run: pnpm run doctor:expo
