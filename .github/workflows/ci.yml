name: CI

# Every branch PRs into main — main is both the staging lane and the only PR target
# (issue civfix/issue-tracker#108).
#
# `dev` is still listed ONLY for the duration of the lane cutover. A `pull_request` trigger is evaluated
# from the MERGE commit, so the moment this file says `[main]` a PR into `dev` runs no CI at all — which
# would have left the cutover PRs themselves unvalidated. Drop `dev` in the same change that deletes the
# branch.
on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: packages (shared + ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build typecheck lint test --filter="./packages/*"
      - run: pnpm --filter @civfix/ui i18n:check

  web:
    name: community-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck build test --filter=community-web

  mobile:
    name: community-mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint test --filter=community-mobile
      - run: npx expo-doctor
        working-directory: apps/community-mobile
