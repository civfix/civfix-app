name: Deploy web (Cloudflare Pages)

# Builds apps/community-web (static export) and publishes it to the Cloudflare Pages project
# "civfix-web". TWO environments, selected by the REF this runs on
# (issue https://github.com/civfix/issue-tracker/issues/108):
#
#   push to main        -> STAGING    --branch=staging  -> civfix.dev       (api.civfix.dev, Stripe TEST)
#   a published v* tag  -> PRODUCTION --branch=main     -> civfix.org       (api.civfix.org, Stripe LIVE)
#
# There is no `dev` branch any more: feature branches PR into main, main IS staging, and cutting a
# release promotes to production.
#
# WHY THIS IS A REBUILD AND NOT A BYTE-PROMOTION. The backend's Docker images are built once and the
# same digests are promoted to prod. A Next static export cannot work that way: every NEXT_PUBLIC_* is
# INLINED INTO THE BUNDLE at build time, so the staging artifact has api.civfix.dev and the Stripe TEST
# key compiled into it. Production is therefore rebuilt FROM THE RELEASE TAG — the same commit, with
# production values. Same source, not the same bytes; see civfix-infra/docs/DEPLOY.md §Promotion.
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_TURNSTILE_SITEKEY,
#              NEXT_PUBLIC_CARTO_API_KEY, NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE (production only),
#              NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST (staging only)
#
# On a push, only paths that feed the web build trigger a deploy; a mobile-only change never redeploys
# the site. A release always deploys, so a tag produces a complete, self-consistent production.

on:
  push:
    branches: [main]
    paths:
      - "apps/community-web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".npmrc"
      - ".github/workflows/deploy-web.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: build + publish to Cloudflare Pages
    runs-on: ubuntu-latest
    # ONE derived value decides everything below. The previous version repeated a three-armed
    # `github.ref_name == ...` ternary in four separate `env:` expressions, which is how a build once
    # shipped a test key to civfix.org and a live key to a public preview: four chances to get the same
    # decision wrong independently, and no check that they agreed. Decide once, here, then assert.
    env:
      DEPLOY_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - name: Refuse a deploy from any ref but main or a v* release tag
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) ;;
            *)
              echo "::error::deploy-web.yml may only run on main or a v* tag; refusing '$GITHUB_REF'."
              exit 1
              ;;
          esac
          echo "ref $GITHUB_REF -> $DEPLOY_ENV"

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore Turbo + Next.js build cache
        # THE CACHE KEY IS SCOPED BY ENVIRONMENT, and that is not tidiness. Staging and production now
        # build the SAME COMMIT with different NEXT_PUBLIC_* values, so a key on the sha alone would let
        # the production build restore the Next webpack cache the staging build just wrote — and those
        # values are inlined into the chunks at compile time. Turbo hashes its env inputs and would
        # rebuild, but `.next/cache` is restored underneath it by this step, so the guarantee has to be
        # here. Never merge these two caches.
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/community-web/.next/cache
          key: ${{ runner.os }}-web-build-${{ env.DEPLOY_ENV }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-web-build-${{ env.DEPLOY_ENV }}-

      - name: Resolve the build environment
        # Every NEXT_PUBLIC_* is resolved once, from DEPLOY_ENV, and written to $GITHUB_ENV for the two
        # steps that follow. The `|| ''` arms are load-bearing: an unset variable must produce an empty
        # value, never fall through to the other environment's.
        env:
          PROD_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          PROD_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          PROD_TURNSTILE: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITEKEY }}
          STRIPE_LIVE: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE }}
          STRIPE_TEST: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENV" = "production" ]; then
            api="$PROD_API_URL"; site="$PROD_SITE_URL"; turnstile="$PROD_TURNSTILE"
            stripe="$STRIPE_LIVE"; pages_branch=main
          else
            api="https://api.civfix.dev"; site="https://civfix.dev"; turnstile=""
            stripe="$STRIPE_TEST"; pages_branch=staging
          fi
          {
            echo "NEXT_PUBLIC_API_URL=$api"
            echo "NEXT_PUBLIC_SITE_URL=$site"
            echo "NEXT_PUBLIC_TURNSTILE_SITEKEY=$turnstile"
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$stripe"
            echo "PAGES_BRANCH=$pages_branch"
          } >> "$GITHUB_ENV"

      - name: Assert the build targets and the keys agree
        # The one check that makes a cross-environment mix-up impossible rather than merely unlikely.
        # It runs BEFORE the build, so a mismatch costs nothing, and it checks the values that were
        # actually resolved — not the expressions that were supposed to resolve them.
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          case "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" in
            ""|pk_live_*|pk_test_*) ;;
            *) fail "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is neither empty nor a pk_live_/pk_test_ key." ;;
          esac
          if [ "$DEPLOY_ENV" = "production" ]; then
            [ "$NEXT_PUBLIC_API_URL" = "https://api.civfix.org" ] \
              || fail "production build points at '$NEXT_PUBLIC_API_URL', not https://api.civfix.org."
            [ "$NEXT_PUBLIC_SITE_URL" = "https://civfix.org" ] \
              || fail "production build declares site '$NEXT_PUBLIC_SITE_URL', not https://civfix.org."
            case "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" in
              pk_live_*) ;;
              *) fail "production build has no LIVE Stripe key (got '${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:0:8}...'). Check vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE." ;;
            esac
            [ -n "$NEXT_PUBLIC_TURNSTILE_SITEKEY" ] \
              || fail "production build has no Turnstile sitekey; signup abuse controls would be off."
            [ "$PAGES_BRANCH" = "main" ] || fail "production must publish to the Pages production branch."
          else
            case "$NEXT_PUBLIC_API_URL" in
              https://api.civfix.dev) ;;
              *) fail "staging build points at '$NEXT_PUBLIC_API_URL', not https://api.civfix.dev." ;;
            esac
            case "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" in
              ""|pk_test_*) ;;
              *) fail "staging build carries a non-test Stripe key. Refusing to publish it publicly." ;;
            esac
            [ "$PAGES_BRANCH" != "main" ] || fail "staging must not publish to the Pages production branch."
          fi
          echo "$DEPLOY_ENV: api=$NEXT_PUBLIC_API_URL site=$NEXT_PUBLIC_SITE_URL stripe=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:0:8}... pages-branch=$PAGES_BRANCH"

      - name: Build static export
        # NEXT_PUBLIC_* come from $GITHUB_ENV (resolved and asserted above) and are inlined here.
        env:
          NEXT_PUBLIC_CARTO_API_KEY: ${{ vars.NEXT_PUBLIC_CARTO_API_KEY }}
        run: pnpm turbo run build --filter=community-web

      - name: Publish to Cloudflare Pages
        # wrangler reads apps/community-web/wrangler.jsonc (project name + out dir) and uploads the
        # sibling functions/ dir, so the deploy runs from the app directory. `pnpm dlx` keeps wrangler
        # outside the workspace (pnpm refuses `pnpm add` in a workspace root).
        working-directory: apps/community-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # $PAGES_BRANCH, not the git ref: Cloudflare treats the project's production branch name as
        # "this is production". `main` is that name and must only ever be published by a release build;
        # staging publishes the `staging` alias, which is what civfix.dev points at.
        run: pnpm dlx wrangler@3 pages deploy --branch="$PAGES_BRANCH"
