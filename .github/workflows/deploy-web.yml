name: Deploy web (Cloudflare Pages)

# Builds apps/community-web (static export) and publishes it to the Cloudflare Pages project
# "civfix-web". The ref this runs on selects the environment:
#
#   push to main        -> STAGING    --branch=staging  -> civfix.dev       (api.civfix.dev)
#   a published v* tag  -> PRODUCTION --branch=main     -> civfix.org       (api.civfix.org)
#
# Production is a rebuild of the release tag, not a byte-promotion of the staging artifact: every
# NEXT_PUBLIC_* is inlined into the bundle at build time, so the staging bundle has api.civfix.dev
# compiled into it. Same source, not the same bytes; see civfix-infra/docs/DEPLOY.md §Promotion.
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_TURNSTILE_SITEKEY,
#              NEXT_PUBLIC_CARTO_API_KEY
#
# On a push, only paths that feed the web build trigger a deploy; a mobile-only change never redeploys
# the site. A release always deploys, so a tag produces a complete, self-consistent production.

on:
  push:
    branches: [main]
    paths:
      - "apps/community-web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".npmrc"
      - ".github/workflows/deploy-web.yml"
  release:
    # `released`, NOT `published`: `published` also fires for a PRERELEASE, and a prerelease must never
    # reach civfix.org. The regex in the production gate below is the second, independent guard.
    types: [released]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Run on an older v* tag to deliberately put that release back on civfix.org"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: build + publish to Cloudflare Pages
    runs-on: ubuntu-latest
    # One derived value decides every environment-specific setting below, and a later step asserts the
    # resolved values agree. Deciding it separately per setting lets one of them pick the wrong
    # environment (a test key on civfix.org, a live key on a public preview) with nothing to catch it.
    env:
      DEPLOY_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - name: Refuse a deploy from any ref but main or a v* release tag
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) ;;
            *)
              echo "::error::deploy-web.yml may only run on main or a v* tag; refusing '$GITHUB_REF'."
              exit 1
              ;;
          esac
          echo "ref $GITHUB_REF -> $DEPLOY_ENV"

      - uses: actions/checkout@v4
        with:
          # Full history: the production gate below proves the tag is an ancestor of main.
          fetch-depth: 0

      - name: Prove the production ref (tag shape + merged into main + newest release)
        # A branch-protection control: `main` requires a reviewed PR and tags do not, so without this a
        # tag on an unreviewed branch would go straight to civfix.org. civfix-backend's deploy.yml
        # carries the same proof; keep the regex identical to that one and to CIVFIX_RELEASE_TAG_REGEX
        # in civfix-infra. The newest-release check stops a re-published old release (or a dispatch on
        # an old tag) from silently rolling civfix.org back; a deliberate rollback sets `rollback`.
        if: env.DEPLOY_ENV == 'production'
        env:
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          RELEASE_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if ! printf '%s' "$tag" | grep -qE "$RELEASE_RE"; then
            echo "::error::'$tag' is not a vMAJOR.MINOR.PATCH release tag; refusing to deploy production."
            echo "::error::Prereleases are excluded by design."
            exit 1
          fi
          git fetch --quiet --force --tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$tag" origin/main; then
            echo "::error::tag '$tag' is not merged into main. Production only ships code that went"
            echo "::error::through the staging lane and a reviewed PR. Refusing to deploy."
            exit 1
          fi
          # `|| true`: a grep that matches nothing would otherwise end the step here under errexit,
          # before the comparison below can explain the refusal.
          newest="$(git tag --list 'v*' --sort=-v:refname --merged origin/main | grep -E "$RELEASE_RE" | head -n 1)" || true
          if [ "$tag" != "$newest" ]; then
            if [ "$ROLLBACK" != "true" ]; then
              echo "::error::'$tag' is not the newest release ('$newest' is). Deploying it would roll civfix.org"
              echo "::error::back. To do that on purpose, run this workflow on the '$tag' tag with rollback checked."
              exit 1
            fi
            echo "::warning::Deliberate rollback: deploying $tag to civfix.org while $newest is the newest release."
          fi
          echo "$tag is a release tag merged into main"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore Turbo + Next.js build cache
        # The cache key is scoped by environment. Staging and production build the same commit with
        # different NEXT_PUBLIC_* values, which are inlined into the chunks at compile time, so a key on
        # the sha alone would let production restore the Next webpack cache staging just wrote. Turbo
        # hashes its env inputs, but this step restores `.next/cache` underneath it, so the guarantee
        # has to be here. Never merge these two caches.
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/community-web/.next/cache
          key: ${{ runner.os }}-web-build-${{ env.DEPLOY_ENV }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-web-build-${{ env.DEPLOY_ENV }}-

      - name: Resolve the build environment
        # Every NEXT_PUBLIC_* is resolved once, from DEPLOY_ENV, and written to $GITHUB_ENV for the two
        # steps that follow. The `|| ''` arms are load-bearing: an unset variable must produce an empty
        # value, never fall through to the other environment's.
        env:
          PROD_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          PROD_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          PROD_TURNSTILE: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITEKEY }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENV" = "production" ]; then
            api="$PROD_API_URL"; site="$PROD_SITE_URL"; turnstile="$PROD_TURNSTILE"
            pages_branch=main
          else
            api="https://api.civfix.dev"; site="https://civfix.dev"; turnstile=""
            pages_branch=staging
          fi
          # Heredoc delimiters, not `KEY=value` lines: a repo variable containing a newline would
          # otherwise inject arbitrary extra KEY=VALUE pairs into the job environment.
          emit() { printf '%s<<__CIVFIX_EOF__\n%s\n__CIVFIX_EOF__\n' "$1" "$2" >> "$GITHUB_ENV"; }
          emit NEXT_PUBLIC_API_URL "$api"
          emit NEXT_PUBLIC_SITE_URL "$site"
          emit NEXT_PUBLIC_TURNSTILE_SITEKEY "$turnstile"
          emit PAGES_BRANCH "$pages_branch"

      - name: Assert the build targets agree
        # Makes a cross-environment mix-up impossible rather than merely unlikely. It runs before the
        # build, so a mismatch costs nothing, and it checks the values actually resolved, not the
        # expressions that were supposed to resolve them.
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          if [ "$DEPLOY_ENV" = "production" ]; then
            [ "$NEXT_PUBLIC_API_URL" = "https://api.civfix.org" ] \
              || fail "production build points at '$NEXT_PUBLIC_API_URL', not https://api.civfix.org."
            [ "$NEXT_PUBLIC_SITE_URL" = "https://civfix.org" ] \
              || fail "production build declares site '$NEXT_PUBLIC_SITE_URL', not https://civfix.org."
            [ -n "$NEXT_PUBLIC_TURNSTILE_SITEKEY" ] \
              || fail "production build has no Turnstile sitekey; signup abuse controls would be off."
            [ "$PAGES_BRANCH" = "main" ] || fail "production must publish to the Pages production branch."
          else
            case "$NEXT_PUBLIC_API_URL" in
              https://api.civfix.dev) ;;
              *) fail "staging build points at '$NEXT_PUBLIC_API_URL', not https://api.civfix.dev." ;;
            esac
            [ "$PAGES_BRANCH" != "main" ] || fail "staging must not publish to the Pages production branch."
          fi
          echo "$DEPLOY_ENV: api=$NEXT_PUBLIC_API_URL site=$NEXT_PUBLIC_SITE_URL pages-branch=$PAGES_BRANCH"

      - name: Build static export
        # The other NEXT_PUBLIC_* values come from $GITHUB_ENV, resolved and asserted above.
        env:
          NEXT_PUBLIC_CARTO_API_KEY: ${{ vars.NEXT_PUBLIC_CARTO_API_KEY }}
        run: pnpm turbo run build --filter=community-web

      - name: Publish to Cloudflare Pages
        # wrangler reads apps/community-web/wrangler.jsonc (project name + out dir) and uploads the
        # sibling functions/ dir, so the deploy runs from the app directory. `pnpm dlx` keeps wrangler
        # outside the workspace (pnpm refuses `pnpm add` in a workspace root).
        working-directory: apps/community-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # $PAGES_BRANCH, not the git ref: Cloudflare treats the project's production branch name as
        # "this is production". `main` is that name and must only ever be published by a release build;
        # staging publishes the `staging` alias, which is what civfix.dev points at.
        run: pnpm dlx wrangler@3 pages deploy --branch="$PAGES_BRANCH"
