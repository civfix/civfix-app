name: Deploy web (Cloudflare Pages)

# Builds apps/community-web (static export) and publishes it to the Cloudflare Pages project
# "civfix-web" on every push to main (production -> civfix.org) or dev (preview -> civfix.dev).
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_TURNSTILE_SITEKEY,
#              NEXT_PUBLIC_CARTO_API_KEY, NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE (main only),
#              NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST (dev only)
#
# Only paths that feed the web build trigger a deploy; a mobile-only change never redeploys the site.

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/community-web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".npmrc"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: build + publish to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a deploy from any ref but main or dev
        env:
          DEPLOY_REF: ${{ github.ref_name }}
        run: |
          if [ "$DEPLOY_REF" != "main" ] && [ "$DEPLOY_REF" != "dev" ]; then
            echo "::error::deploy-web.yml may only run on main or dev; refusing ref '$DEPLOY_REF'."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore Turbo + Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/community-web/.next/cache
          key: ${{ runner.os }}-web-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-web-build-

      - name: Build static export
        # NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is three-armed on purpose: main gets the LIVE key, dev gets
        # the TEST key, and any other ref gets '' so a build can never ship a test key to civfix.org or
        # a live key to a public preview (both happened once). Keep the trailing || '' arm.
        env:
          NEXT_PUBLIC_API_URL: ${{ github.ref_name == 'dev' && 'https://api.civfix.dev' || vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ github.ref_name == 'dev' && 'https://civfix.dev' || vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ github.ref_name == 'main' && vars.NEXT_PUBLIC_TURNSTILE_SITEKEY || '' }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ vars.NEXT_PUBLIC_CARTO_API_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ (github.ref_name == 'main' && vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE) || (github.ref_name == 'dev' && vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST) || '' }}
        run: pnpm turbo run build --filter=community-web

      - name: Publish to Cloudflare Pages
        # wrangler reads apps/community-web/wrangler.jsonc (project name + out dir) and uploads the
        # sibling functions/ dir, so the deploy runs from the app directory. `pnpm dlx` keeps wrangler
        # outside the workspace (pnpm refuses `pnpm add` in a workspace root).
        working-directory: apps/community-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: pnpm dlx wrangler@3 pages deploy --branch="$DEPLOY_BRANCH"
