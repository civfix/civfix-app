name: publish @civfix/shared

# Publishes @civfix/shared to the private registry (repo.civfix.org) when its version is ahead of the
# registry, on push to main. @civfix/ui and both apps are private and are never published; the backend,
# admin and gov consumers install @civfix/shared from the registry, which is why this flow survives.
#
# Flow: `pnpm changeset` while developing -> `pnpm changeset version` before merging -> this workflow
# runs `changeset publish`, which is a no-op when nothing is ahead of the registry (so it runs on every
# main push and a failed publish is retried by the next one). Tags are pushed so each release is
# findable (@civfix/shared@X.Y.Z); changesets creates annotated tags, hence the git identity step.
#
# Required repository secret: NPM_TOKEN (the Verdaccio ci-publisher token).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-shared
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure git identity for release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @civfix/shared build

      - name: Append registry auth to .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          {
            echo "//repo.civfix.org/:_authToken=${NPM_TOKEN}"
            echo "git-checks=false"
          } >> .npmrc
      - name: Publish
        run: pnpm changeset publish
      - name: Push release tags
        run: git push origin --tags

      - name: Restore .npmrc
        if: always()
        run: git checkout -- .npmrc
